    <text x="18" y="40" fill="#07111f" font-family="Arial, sans-serif" font-size="32" font-weight="800">P</text>
    <text x="78" y="28" fill="#9eb1c3" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="4">OPERATIONAL INTELLIGENCE</text>
    <text x="0" y="130" fill="#f0f7fa" font-family="Arial, sans-serif" font-size="57" font-weight="800">PROMETHEUS FORGE</text>
    <text x="0" y="177" fill="#b9cbd7" font-family="Arial, sans-serif" font-size="23">Understand assets. Anticipate risk. Decide with accountability.</text>
    <rect y="218" width="369" height="4" rx="2" fill="url(#accent)"/>
