<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Prometheus Forge</title>
  <desc id="desc">Operational intelligence for physical assets</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#12344b"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#41d9c2"/><stop offset="1" stop-color="#72a7ff"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity=".06"/></pattern>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <circle cx="1060" cy="116" r="230" fill="#41d9c2" fill-opacity=".08"/>
  <circle cx="1150" cy="330" r="190" fill="#72a7ff" fill-opacity=".09"/>
  <path d="M720 309C824 194 922 311 1013 191S1178 219 1280 92" fill="none" stroke="url(#accent)" stroke-width="3" opacity=".9"/>
